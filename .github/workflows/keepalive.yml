name: Render Free Tier Keep-Alive Heartbeat

on:
  # Automated cron schedule disabled to ensure Render server stays OFF/hibernated when not in active use.
  # schedule:
  #   - cron: '*/12 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optional override URL to ping (e.g. brandguard-backend.onrender.com)'
        required: false
        default: ''

jobs:
  ping-healthz:
    name: Ping Healthz Liveness Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve Target URL
        id: resolve
        run: |
          TARGET="${{ github.event.inputs.target_url }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ secrets.RENDER_APP_URL }}"
          fi
          if [ -z "$TARGET" ]; then
            TARGET="brandguard-backend.onrender.com"
          fi
          # Strip protocol if present
          CLEAN_TARGET=$(echo "$TARGET" | sed -e 's|^[^/]*//||' -e 's|/.*$||')
          echo "target_host=$CLEAN_TARGET" >> $GITHUB_OUTPUT
          echo "Target Host: $CLEAN_TARGET"

      - name: Ping /healthz Liveness Endpoint
        id: ping_healthz
        run: |
          HOST="${{ steps.resolve.outputs.target_host }}"
          URL="https://${HOST}/healthz"
          echo "Sending keep-alive probe to $URL ..."

          HTTP_RESPONSE=$(curl -s -S -L -w "\n%{http_code}\n%{time_total}" --max-time 45 "$URL" || true)

          # Parse body, code, time
          HTTP_TIME=$(echo "$HTTP_RESPONSE" | tail -n1)
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n2 | head -n1)
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d' | sed '$d')

          echo "HTTP Status Code : $HTTP_CODE"
          echo "Response Time    : ${HTTP_TIME}s"
          echo "Response Body    : $HTTP_BODY"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "Status: Server is healthy and awake."
          elif [ "$HTTP_CODE" -eq 503 ]; then
            echo "Warning: Server responded 503 (Database reconnecting or cold starting)."
          else
            echo "Notice: Non-200 response ($HTTP_CODE). If this is a first deployment or secret not configured, verify RENDER_APP_URL secret."
          fi

      - name: Optional Deep Readiness Check /readyz
        continue-on-error: true
        run: |
          HOST="${{ steps.resolve.outputs.target_host }}"
          URL="https://${HOST}/readyz"
          echo "Checking deep readiness at $URL ..."
          curl -s -S -L --max-time 20 "$URL" || true
          echo ""

