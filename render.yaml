# ==============================================================================
# BrandGuard Enterprise Platform - Render Deployment Blueprint (IaC)
# Conforms to Render Blueprint Spec v1
# ==============================================================================

databases:
  # Managed PostgreSQL Database for multi-tenant enterprise persistence
  - name: brandguard-postgres
    plan: free
    region: oregon
    databaseName: brandguard_db
    user: brandguard_user
    ipAllowList: [] # Internal service network access only

services:
  # ==============================================================================
  # 1. BrandGuard Django Backend Service
  # ==============================================================================
  - type: web
    name: brandguard-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    healthCheckPath: /healthz
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo"
    startCommand: "gunicorn brandguard_core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: brandguard_core.settings
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: BRANDGUARD_SECRET_KEY
        value: "brandguard-hmac-seal-key-2026-production"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: BRANDGUARD_MAX_JOB_THREADS
        value: "4"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "true"
      - key: BRANDGUARD_ENV
        value: "production"
      - key: DATABASE_URL
        fromDatabase:
          name: brandguard-postgres
          property: connectionString

  # ==============================================================================
  # 2. BrandGuard React Single Page App (Frontend)
  # ==============================================================================
  - type: web
    name: brandguard-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm install && chmod -R +x node_modules/.bin && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
